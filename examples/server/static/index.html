<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitDb Server</title>
    <style>
      :root { color-scheme: light dark; --line: #d0d7de; --accent: #0969da; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem;
               padding: .75rem 1rem; border-bottom: 1px solid var(--line); }
      header h1 { font-size: 1rem; margin: 0; }
      #connection { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      main { display: flex; min-height: calc(100vh - 3.25rem); }
      nav { width: 15rem; flex: none; border-right: 1px solid var(--line); padding: 1rem; }
      nav h2 { font-size: .8rem; margin: 0 0 .5rem; }
      nav button { display: block; width: 100%; text-align: left; margin-bottom: .25rem;
                   padding: .35rem .5rem; border: 1px solid transparent; border-radius: 6px;
                   background: none; cursor: pointer; font: inherit; }
      nav button[aria-current="true"] { border-color: var(--accent); color: var(--accent); }
      section { flex: 1; min-width: 0; padding: 1rem; overflow: auto; }
      form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: flex-end; }
      label { display: flex; flex-direction: column; gap: .25rem; font-size: .8rem; }
      input { padding: .35rem .5rem; border: 1px solid var(--line); border-radius: 6px;
              font: inherit; min-width: 12rem; max-width: 100%; }
      button.primary { padding: .4rem .9rem; border: 1px solid var(--accent); border-radius: 6px;
                       background: var(--accent); color: #fff; cursor: pointer; font: inherit; }
      .table-wrap { margin-top: 1rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { border-collapse: collapse; width: auto; min-width: 100%; }
      th, td { border: 1px solid var(--line); padding: .35rem .5rem; text-align: left;
               vertical-align: top; font-family: ui-monospace, monospace; font-size: .8rem;
               max-width: 16rem; overflow-wrap: anywhere; }
      th { background: rgba(127, 127, 127, .12); white-space: nowrap; }
      .status { margin-top: .75rem; }
      .error { color: #cf222e; }
      .empty { margin-top: 1rem; color: #57606a; }
      .hidden { display: none !important; }
      button[disabled] { opacity: .6; cursor: progress; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #login { max-width: 26rem; margin: 3rem auto; display: block; padding: 0 1rem; }
      #login label { margin-bottom: .5rem; }
      #login input { width: 100%; }
      #login p.note { font-size: .8rem; color: #57606a; }

      /* Phones and narrow windows: stack the layout and grow the tap targets. */
      @media (max-width: 48rem) {
        main { flex-direction: column; min-height: 0; }
        nav { width: auto; border-right: none; border-bottom: 1px solid var(--line);
              padding: .75rem 1rem; }
        #collections { display: flex; flex-wrap: wrap; gap: .5rem; }
        nav button { width: auto; min-width: 0; max-width: 100%; margin: 0; min-height: 2.75rem;
                     overflow-wrap: anywhere; border-color: var(--line); padding: .5rem .75rem; }
        section { padding: 1rem; overflow: visible; }
        label { flex: 1 1 100%; font-size: .9rem; }
        input { width: 100%; min-width: 0; font-size: 16px; min-height: 2.75rem; }
        button.primary { width: 100%; min-height: 2.75rem; }
        header button.primary { width: auto; padding: .4rem .9rem; }
        #login { margin: 1.5rem auto; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GitDb Server</h1>
      <span id="connection"></span>
      <button id="logout" class="primary hidden" type="button">Sign out</button>
    </header>

    <form id="login">
      <label>Repository <input name="repo" placeholder="owner/name" required autocomplete="off" /></label>
      <label>Token <input name="token" type="password" placeholder="github_pat_..." required autocomplete="off" /></label>
      <label>Branch <input name="branch" value="main" autocomplete="off" /></label>
      <label>Data root <input name="root" value="data" autocomplete="off" /></label>
      <button class="primary" type="submit">Sign in</button>
      <p id="login-status" class="status" role="status" aria-live="polite"></p>
      <p class="note">
        The token is exchanged for a session cookie and kept in the server
        process memory only. The repository, branch and data root are remembered
        in this browser so you do not have to retype them.
      </p>
    </form>

    <main id="workspace" class="hidden">
      <nav>
        <h2>Tables</h2>
        <div id="collections"></div>
      </nav>
      <section>
        <form id="query">
          <label>Table <input name="collection" required autocomplete="off" /></label>
          <label>Field <input name="field" placeholder="(all documents)" autocomplete="off" /></label>
          <label>Equals <input name="value" autocomplete="off" /></label>
          <label>Limit <input name="limit" type="number" value="50" min="1" max="500" /></label>
          <button class="primary" type="submit">Run query</button>
        </form>
        <p id="query-status" class="status" role="status" aria-live="polite"></p>
        <p id="query-empty" class="empty hidden"></p>
        <div class="table-wrap"><table id="results"></table></div>
      </section>
    </main>

    <script>
      const $ = (selector) => document.querySelector(selector);

      /** localStorage key for the non-secret connection settings. */
      const SETTINGS_KEY = "gitdb-server.connection";

      /** True while a query is in flight, so clicks cannot pile up. */
      let querying = false;

      async function api(path, options) {
        const response = await fetch(path, options);
        if (response.status === 204) return null;
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.detail || response.statusText);
        return payload;
      }

      function post(path, body) {
        return api(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      }

      function say(element, message, isError) {
        element.textContent = message;
        element.classList.toggle("error", Boolean(isError));
      }

      /** Disable a form while it is working, so a click cannot be repeated. */
      function busy(form, isBusy, label) {
        const button = form.querySelector("button.primary");
        button.disabled = isBusy;
        button.textContent = isBusy ? label.busy : label.idle;
        form.setAttribute("aria-busy", String(isBusy));
      }

      /** Non-secret connection settings, remembered between visits. */
      function loadSettings() {
        try {
          return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
        } catch {
          return {};
        }
      }

      function saveSettings({ repo, branch, root }) {
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify({ repo, branch, root }));
        } catch {
          /* Private browsing or a full quota: remembering is best effort. */
        }
      }

      function showCollections(names) {
        const container = $("#collections");
        container.replaceChildren();
        if (!names.length) {
          const empty = document.createElement("p");
          empty.textContent = "No tables found under the data root.";
          container.append(empty);
          return;
        }
        for (const name of names) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = name;
          button.addEventListener("click", () => {
            $("#query").collection.value = name;
            runQuery();
          });
          container.append(button);
        }
      }

      function cell(tag, value) {
        const element = document.createElement(tag);
        element.textContent =
          value === undefined ? "" : typeof value === "object" && value !== null
            ? JSON.stringify(value)
            : String(value);
        /* Cells are clipped to keep the table readable; show the full value on hover. */
        if (element.textContent) element.title = element.textContent;
        return element;
      }

      function showResults(columns, documents) {
        const table = $("#results");
        table.replaceChildren();
        if (!documents.length) return;
        const head = document.createElement("tr");
        for (const column of columns) head.append(cell("th", column));
        table.append(head);
        for (const document_ of documents) {
          const row = document.createElement("tr");
          for (const column of columns) row.append(cell("td", document_[column]));
          table.append(row);
        }
      }

      async function runQuery() {
        const form = $("#query");
        const status = $("#query-status");
        const empty = $("#query-empty");
        const field = form.field.value.trim();
        if (querying) return;
        querying = true;
        busy(form, true, { idle: "Run query", busy: "Running..." });
        empty.classList.add("hidden");
        say(status, "Running query...", false);
        try {
          const result = await post("/api/query", {
            collection: form.collection.value.trim(),
            field,
            value: form.value.value,
            limit: Number(form.limit.value),
          });
          showResults(result.columns, result.documents);
          say(status, `${result.documents.length} document(s) in ${result.collection}.`, false);
          if (!result.documents.length) {
            say(
              empty,
              field
                ? `No document in ${result.collection} has ${field} equal to that value.`
                : `${result.collection} has no documents yet.`,
              false,
            );
            empty.classList.remove("hidden");
          }
          for (const button of $("#collections").children) {
            if (button.tagName === "BUTTON") {
              button.setAttribute("aria-current", String(button.textContent === result.collection));
            }
          }
        } catch (error) {
          $("#results").replaceChildren();
          say(status, error.message, true);
        } finally {
          querying = false;
          busy(form, false, { idle: "Run query", busy: "Running..." });
        }
      }

      function connected(session) {
        $("#connection").textContent = `${session.repo} @ ${session.branch}`;
        $("#login").classList.add("hidden");
        $("#workspace").classList.remove("hidden");
        $("#logout").classList.remove("hidden");
        showCollections(session.collections);
        $("#query").collection.focus();
      }

      $("#login").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.target;
        const settings = {
          repo: form.repo.value.trim(),
          branch: form.branch.value.trim(),
          root: form.root.value.trim(),
        };
        busy(form, true, { idle: "Sign in", busy: "Signing in..." });
        say($("#login-status"), "Signing in...", false);
        try {
          const session = await post("/api/login", { ...settings, token: form.token.value });
          form.token.value = "";
          say($("#login-status"), "", false);
          saveSettings(settings);
          connected(session);
        } catch (error) {
          say($("#login-status"), error.message, true);
        } finally {
          busy(form, false, { idle: "Sign in", busy: "Signing in..." });
        }
      });

      $("#logout").addEventListener("click", async () => {
        await post("/api/logout", {});
        location.reload();
      });

      $("#query").addEventListener("submit", (event) => {
        event.preventDefault();
        runQuery();
      });

      /* Prefill the remembered repository, branch and data root (never a token). */
      const remembered = loadSettings();
      const loginForm = $("#login");
      for (const field of ["repo", "branch", "root"]) {
        if (remembered[field]) loginForm[field].value = remembered[field];
      }
      loginForm.repo.focus();

      api("/api/collections")
        .then(connected)
        .catch(() => {});
    </script>
  </body>
</html>
